# Render Blueprint for the exchange engine. The Next.js app is deployed separately on Vercel.
services:
  - type: web
    name: trading-engine
    runtime: docker
    region: ohio # next to the Supabase project (us-east-2)
    # Free: 0.1 CPU / 512 MB, single instance. It spins down after 15 minutes without inbound
    # traffic; live bots send orders every tick and open pages send a keep-alive, and a restart
    # or spin-down is recovered by replaying the lobby from Supabase.
    plan: free
    dockerfilePath: ./engine/Dockerfile
    dockerContext: ./engine
    buildFilter:
      paths:
        - engine/**
        - render.yaml
    healthCheckPath: /health
    # Deploys drop every WebSocket; deploy deliberately, never during a live lobby.
    autoDeployTrigger: "off"
    # Time to flush pending writes and release lobby leases on shutdown.
    maxShutdownDelaySeconds: 60
    envVars:
      - key: SUPABASE_URL
        value: https://cjbtwjkotakbtxmnhqhq.supabase.co
      - key: SUPABASE_SECRET_KEY # Supabase dashboard > Settings > API Keys > secret key
        sync: false
      - key: ALLOWED_ORIGINS # e.g. https://your-app.vercel.app,http://localhost:3000
        sync: false
